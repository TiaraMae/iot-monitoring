{% extends "base.html" %}

{% block title %}Sign Up - IoT Monitoring{% endblock %}

{% block head %}
<style>
    .auth-card {
        background: #fff;
        max-width: 420px;
        margin: 4rem auto;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .auth-card h2 { text-align: center; margin-bottom: 0.5rem; }
    .auth-card .subtitle { text-align: center; color: #64748B; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
    input[type="email"], input[type="password"], input[type="text"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
        font-size: 1rem;
    }
    input:focus { outline: none; border-color: #2563EB; }
    .btn {
        width: 100%;
        padding: 0.8rem;
        border: none;
        border-radius: 8px;
        background: #2563EB;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
    }
    .btn:hover { background: #1D4ED8; }
    .link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    .link a { color: #2563EB; text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Start monitoring your appliances</p>
    <form method="POST" action="{{ url_for('auth.signup') }}">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="At least 6 characters">
        </div>
        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
