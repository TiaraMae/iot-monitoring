{% extends "base.html" %}

{% block title %}Set New Password - IoT Monitoring{% endblock %}

{% block head %}
<style>
    .auth-card {
        background: #fff;
        max-width: 420px;
        margin: 4rem auto;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .auth-card h2 { text-align: center; margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
    input[type="email"], input[type="password"], input[type="text"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
        font-size: 1rem;
    }
    input:focus { outline: none; border-color: #2563EB; }
    .btn {
        width: 100%;
        padding: 0.8rem;
        border: none;
        border-radius: 8px;
        background: #2563EB;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
    }
    .btn:hover { background: #1D4ED8; }
    .links { display: flex; justify-content: space-between; margin-top: 1rem; font-size: 0.85rem; }
    .links a { color: #2563EB; text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create new password</h2>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" maxlength="64" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8" maxlength="64" placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn">UPDATE PASSWORD</button>
    </form>
    <div class="links">
        <a href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
</div>
{% endblock %}
