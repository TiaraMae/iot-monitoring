# Nginx main config for the IoT Monitoring production host (Windows).
# Copy this file OVER C:\nginx\conf\nginx.conf (back up the old one first).
#
# Complete standalone config: temp HTTP-only setups and the sites-enabled
# include style are NOT needed — this file has everything.
# SSL paths assume simple-acme's PEM export (see deployment/windows/setup-ssl.ps1).

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 16M;

    # Rate limit zone for the login endpoint
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
    server {
        listen 80;
        server_name iotmonitor.sgu.ac.id;

        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: the dashboard ----
    server {
        listen 443 ssl http2;
        server_name iotmonitor.sgu.ac.id;

        # SSL Certificate (Let's Encrypt, exported by simple-acme)
        ssl_certificate C:/ssl/iotmonitor.sgu.ac.id/iotmonitor.sgu.ac.id-chain.pem;
        ssl_certificate_key C:/ssl/iotmonitor.sgu.ac.id/iotmonitor.sgu.ac.id-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Static files (app/static)
        location /static {
            alias C:/IoTMonitoring/production/app/static;
            expires 1d;
        }

        # Rate limit login endpoint
        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy everything else to the Flask backend (Waitress)
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
