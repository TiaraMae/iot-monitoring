# Temporary HTTP-only Nginx config for pre-SSL phase
# Use this BEFORE the subdomain is connected and BEFORE SSL certificates exist.
# Nginx proxies port 80 directly to Flask/Waitress on localhost:5000.
#
# After SSL is obtained:
#   1. Delete this file
#   2. Copy nginx-iot-monitor.conf to sites-enabled/
#   3. Reload Nginx

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
