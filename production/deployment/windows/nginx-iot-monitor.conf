# Nginx reverse proxy configuration for IoT Monitoring System (Windows, production)
# Place this file in C:\nginx\conf\sites-enabled\ or include it from nginx.conf
#
# Adapted from iot_thesis_v4: proxy target and SSL paths are identical; only the
# static alias points at the production checkout.

# Rate limit zone for login
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name iotmonitor.sgu.ac.id;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root C:/nginx/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name iotmonitor.sgu.ac.id;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate C:/Certbot/live/iotmonitor.sgu.ac.id/fullchain.pem;
    ssl_certificate_key C:/Certbot/live/iotmonitor.sgu.ac.id/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client max body size for uploads
    client_max_body_size 16M;

    # Proxy to Waitress (Flask backend)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Rate limit login endpoint
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (app/static)
    location /static {
        alias C:/IoTMonitoring_Production/app/static;
        expires 1d;
    }
}
